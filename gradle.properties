# -Dfile.encoding=UTF-8 намеренно не задан: в пути с кириллицей на Windows (кодировка Cp1251)
# с ним Gradle не может запустить unit-тесты (ClassNotFoundException для тестовых классов).
org.gradle.jvmargs=-Xmx1024m
kotlin.code.style=official
# Keep compiler and Gradle in one JVM; avoids encoding differences in daemon RPC paths.
kotlin.compiler.execution.strategy=in-process
